openapi: 3.1.0
info:
  title: Meta Framework API
  version: 0.0.0
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Get current authenticated session
      responses:
        '200':
          description: Current authenticated session
          content:
            application/json:
              schema:
                $ref: './common/auth.yaml#/components/schemas/AuthSession'
        default:
          $ref: '#/components/responses/DefaultApiError'
  /auth/logout:
    post:
      operationId: logoutAuthSession
      summary: Logout current authenticated session
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: './common/auth.yaml#/components/schemas/AuthLogoutResponse'
        default:
          $ref: '#/components/responses/DefaultApiError'
  /auth/refresh:
    post:
      operationId: refreshAuthSession
      summary: Refresh current authenticated session
      responses:
        '200':
          description: Refreshed authenticated session
          content:
            application/json:
              schema:
                $ref: './common/auth.yaml#/components/schemas/AuthRefreshResponse'
        default:
          $ref: '#/components/responses/DefaultApiError'
  /auth/login-url:
    get:
      operationId: getAuthLoginUrl
      summary: Get login URL for auth flow
      responses:
        '200':
          description: Login URL response
          content:
            application/json:
              schema:
                $ref: './common/auth.yaml#/components/schemas/AuthLoginUrlResponse'
        default:
          $ref: '#/components/responses/DefaultApiError'
  /health:
    get:
      operationId: getHealth
      summary: Public health check endpoint
      responses:
        '200':
          description: Health status response
          content:
            application/json:
              schema:
                $ref: './core/health.yaml#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/DefaultApiError'
  /users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                $ref: './common/user.yaml#/components/schemas/UserListResponse'
        default:
          $ref: '#/components/responses/DefaultApiError'
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Get current authenticated user
      responses:
        '200':
          description: Current local user projection
          content:
            application/json:
              schema:
                $ref: './common/user.yaml#/components/schemas/User'
        default:
          $ref: '#/components/responses/DefaultApiError'
  /users/{id}:
    get:
      operationId: getUserById
      summary: Get user by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: './common/user.yaml#/components/schemas/User'
        default:
          $ref: '#/components/responses/DefaultApiError'
    delete:
      operationId: deleteUser
      summary: Soft delete user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User archived successfully
          content:
            application/json:
              schema:
                $ref: './core/error.yaml#/components/schemas/SuccessResponse'
        default:
          $ref: '#/components/responses/DefaultApiError'
components:
  responses:
    DefaultApiError:
      description: Error response
      content:
        application/json:
          schema:
            $ref: './core/error.yaml#/components/schemas/ApiError'
  schemas:
    KeycloakTokenClaims:
      $ref: './common/auth.yaml#/components/schemas/KeycloakTokenClaims'
    SessionUser:
      $ref: './common/auth.yaml#/components/schemas/SessionUser'
    AuthSession:
      $ref: './common/auth.yaml#/components/schemas/AuthSession'
    AuthRefreshResponse:
      $ref: './common/auth.yaml#/components/schemas/AuthRefreshResponse'
    AuthLogoutResponse:
      $ref: './common/auth.yaml#/components/schemas/AuthLogoutResponse'
    AuthLoginUrlResponse:
      $ref: './common/auth.yaml#/components/schemas/AuthLoginUrlResponse'
    NotificationPriority:
      $ref: './common/notification.yaml#/components/schemas/NotificationPriority'
    Notification:
      $ref: './common/notification.yaml#/components/schemas/Notification'
    SseNotificationNew:
      $ref: './common/notification.yaml#/components/schemas/SseNotificationNew'
    SseNotificationRead:
      $ref: './common/notification.yaml#/components/schemas/SseNotificationRead'
    SseNotificationArchived:
      $ref: './common/notification.yaml#/components/schemas/SseNotificationArchived'
    SsePing:
      $ref: './common/notification.yaml#/components/schemas/SsePing'
    SseNotificationEvent:
      $ref: './common/notification.yaml#/components/schemas/SseNotificationEvent'
    User:
      $ref: './common/user.yaml#/components/schemas/User'
    UserListItem:
      $ref: './common/user.yaml#/components/schemas/UserListItem'
    UserListResponse:
      $ref: './common/user.yaml#/components/schemas/UserListResponse'
    UserProfile:
      $ref: './common/user.yaml#/components/schemas/UserProfile'
    ApiError:
      $ref: './core/error.yaml#/components/schemas/ApiError'
    ValidationError:
      $ref: './core/error.yaml#/components/schemas/ValidationError'
    SuccessResponse:
      $ref: './core/error.yaml#/components/schemas/SuccessResponse'
    EmptyResponse:
      $ref: './core/error.yaml#/components/schemas/EmptyResponse'
    PaginationQuery:
      $ref: './core/pagination.yaml#/components/schemas/PaginationQuery'
    PaginationMeta:
      $ref: './core/pagination.yaml#/components/schemas/PaginationMeta'
    AuditActor:
      $ref: './core/audit.yaml#/components/schemas/AuditActor'
    AuditFields:
      $ref: './core/audit.yaml#/components/schemas/AuditFields'
    SoftDeleteFields:
      $ref: './core/audit.yaml#/components/schemas/SoftDeleteFields'
    FullAuditFields:
      $ref: './core/audit.yaml#/components/schemas/FullAuditFields'
