components:
  schemas:
    ServiceStatus:
      description: Aggregated status level for a service or the whole application.
      type: string
      enum: [ok, degraded, down]
    ServiceHealth:
      description: Runtime health information for a single named dependency or service.
      type: object
      required: [status]
      properties:
        status:
          description: Current status of the service.
          $ref: '#/components/schemas/ServiceStatus'
        responseTimeMs:
          description: Optional last observed response time in milliseconds.
          type: integer
        message:
          description: Optional human-readable diagnostic message.
          type: string
    HealthResponse:
      description: Public health snapshot for the current application instance.
      type: object
      required: [status, version, timestamp, services]
      properties:
        status:
          description: Aggregated application status derived from individual services.
          $ref: '#/components/schemas/ServiceStatus'
        version:
          description: Current application version.
          type: string
        timestamp:
          description: Timestamp when this health payload was created.
          type: string
          format: date-time
        uptime:
          description: Optional process uptime in whole seconds.
          type: integer
        services:
          description: Map of named services included in the health snapshot.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServiceHealth'
