components:
  schemas:
    AuditActor:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    AuditFields:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/AuditActor'
        updatedBy:
          $ref: '#/components/schemas/AuditActor'
    SoftDeleteFields:
      type: object
      properties:
        deletedAt:
          type: string
          format: date-time
          nullable: true
        deletedBy:
          $ref: '#/components/schemas/AuditActor'
    FullAuditFields:
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - $ref: '#/components/schemas/SoftDeleteFields'
