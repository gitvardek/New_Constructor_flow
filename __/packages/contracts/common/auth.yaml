components:
  schemas:
    KeycloakTokenClaims:
      type: object
      required: [sub, email]
      properties:
        sub:
          type: string
        email:
          type: string
          format: email
        realm_access:
          type: object
          properties:
            roles:
              type: array
              items:
                type: string
    SessionUser:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    AuthSession:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
    AuthRefreshResponse:
      allOf:
        - $ref: '#/components/schemas/AuthSession'
    AuthLogoutResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
    AuthLoginUrlResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
