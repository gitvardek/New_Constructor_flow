components:
  schemas:
    FileConstraints:
      type: object
      properties:
        maxSizeBytes:
          type: integer
        allowedMimeTypes:
          type: array
          items:
            type: string
    FileRecord:
      allOf:
        - $ref: '../core/audit.yaml#/components/schemas/FullAuditFields'
        - type: object
          required: [fileName, url]
          properties:
            fileName:
              type: string
            url:
              type: string
              format: uri
