components:
  schemas:
    LocalizedString:
      type: object
      required: [ru]
      properties:
        ru:
          type: string
        en:
          type: string
    Translation:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
    TranslationsMap:
      type: object
      additionalProperties:
        type: string
